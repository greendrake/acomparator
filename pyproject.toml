[project]
name = "acomparator"
version = "0.1.0"
description = "CLI tool for comparing audio files to detect same source, differences, or partial matches"
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.10",
    "numpy",
    "scipy",
    "soundfile",
    "click",
    "pyacoustid",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
dev = ["ruff>=0.8"]

[project.scripts]
acomparator = "acomparator.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["acomparator*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM108", # ternary operator (not always clearer)
]

[tool.ruff.lint.isort]
known-first-party = ["acomparator"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
